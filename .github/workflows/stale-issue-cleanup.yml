name: Manage Stale Issues and PRs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been automatically marked as stale due to 60 days of inactivity. It will be closed in 14 days if no further activity occurs. Thank you for your contributions to Stellar-Guard!"
          stale-pr-message: "This pull request has been automatically marked as stale due to 45 days of inactivity. It will be closed in 14 days if no further activity occurs."
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "pinned,security,roadmap,confirmed,drips-wave,good first issue,help wanted"
          exempt-pr-labels: "pinned,in-review,work-in-progress"
          stale-issue-label: "status:stale"
          stale-pr-label: "status:stale"

