<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#060810;stop-opacity:1" />
    </linearGradient>
    <!-- Header gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#030918;stop-opacity:0.98" />
      <stop offset="100%" style="stop-color:#060c1c;stop-opacity:0.98" />
    </linearGradient>
    <!-- Logo gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
    <!-- Freeze button -->
    <linearGradient id="freezeBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626" />
      <stop offset="100%" style="stop-color:#b91c1c" />
    </linearGradient>
    <!-- Propose button -->
    <linearGradient id="proposeBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5" />
      <stop offset="100%" style="stop-color:#7c3aed" />
    </linearGradient>
    <!-- Indigo card -->
    <linearGradient id="cardIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0f0d2e;stop-opacity:0.5" />
    </linearGradient>
    <!-- Violet card -->
    <linearGradient id="cardViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e1065;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#150a30;stop-opacity:0.5" />
    </linearGradient>
    <!-- Cyan card -->
    <linearGradient id="cardCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#083344;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#041c26;stop-opacity:0.5" />
    </linearGradient>
    <!-- Green card -->
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#021a0c;stop-opacity:0.5" />
    </linearGradient>
    <!-- Input gradient -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1321;stop-opacity:1" />
    </linearGradient>
    <!-- Proposal row -->
    <linearGradient id="proposalRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0d1321;stop-opacity:0.7" />
    </linearGradient>
    <!-- Soft glow filter -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tinyGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ░░ PHONE FRAME ░░ -->
  <!-- Outer phone shell -->
  <rect x="0" y="0" width="375" height="812" rx="0" fill="url(#bgGrad)" />

  <!-- Subtle nebula glows -->
  <ellipse cx="80" cy="300" rx="150" ry="120" fill="#4f46e5" opacity="0.05" />
  <ellipse cx="300" cy="600" rx="120" ry="100" fill="#7c3aed" opacity="0.04" />

  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.1" opacity="0.4"/>
  </pattern>
  <rect width="375" height="812" fill="url(#grid)" opacity="0.12" />

  <!-- ░░ STATUS BAR ░░ -->
  <rect x="0" y="0" width="375" height="44" fill="#030918" />
  <text x="20" y="28" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">9:41</text>
  <!-- Signal icons -->
  <rect x="300" y="16" width="4" height="12" rx="1" fill="#e2e8f0"/>
  <rect x="307" y="13" width="4" height="15" rx="1" fill="#e2e8f0"/>
  <rect x="314" y="10" width="4" height="18" rx="1" fill="#e2e8f0"/>
  <rect x="321" y="8" width="4" height="20" rx="1" fill="#6b7280"/>
  <!-- WiFi -->
  <text x="333" y="28" font-family="sans-serif" font-size="13" fill="#e2e8f0">WiFi</text>
  <!-- Battery -->
  <rect x="350" y="14" width="18" height="11" rx="2" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="368" y="17" width="2" height="5" rx="1" fill="#e2e8f0" opacity="0.6"/>
  <rect x="351.5" y="15.5" width="12" height="8" rx="1" fill="#22c55e"/>

  <!-- ░░ HEADER BAR ░░ -->
  <rect x="0" y="44" width="375" height="52" fill="url(#headerGrad)" />
  <!-- Header top accent line -->
  <rect x="0" y="44" width="375" height="1.5" fill="url(#proposeBtn)" opacity="0.9" />
  <!-- Header bottom border -->
  <rect x="0" y="95" width="375" height="1" fill="#1e2d4a" opacity="0.6" />

  <!-- Logo mark -->
  <rect x="14" y="56" width="30" height="30" rx="8" fill="url(#logoGrad)" />
  <path d="M27 61 L22 71 L26 71 L23 81 L32 67 L28 67 Z" fill="white" opacity="0.95" />

  <!-- Brand name -->
  <text x="52" y="72" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#818cf8">Stellar</text>
  <text x="102" y="72" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#a78bfa">-Guard</text>

  <!-- Live pill -->
  <rect x="172" y="60" width="72" height="20" rx="10" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
  <circle cx="183" cy="70" r="3.5" fill="#22c55e"/>
  <text x="198" y="74" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#86efac">Testnet Live</text>

  <!-- Hamburger menu -->
  <rect x="330" y="60" width="30" height="30" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="338" y="68" width="14" height="1.5" rx="1" fill="#9ca3af"/>
  <rect x="338" y="73" width="14" height="1.5" rx="1" fill="#9ca3af"/>
  <rect x="338" y="78" width="14" height="1.5" rx="1" fill="#9ca3af"/>

  <!-- Wallet address pill -->
  <rect x="250" y="61" width="72" height="18" rx="9" fill="#111827" stroke="#374151" stroke-width="1"/>
  <circle cx="260" cy="70" r="4" fill="#4f46e5"/>
  <text x="267" y="74" font-family="JetBrains Mono, monospace" font-size="8" fill="#9ca3af">GAKL...3X7Z</text>


  <!-- ░░ EMERGENCY FREEZE BUTTON ░░ -->
  <rect x="14" y="106" width="347" height="52" rx="14" fill="url(#freezeBtn)" filter="url(#softGlow)"/>
  <!-- Shimmer overlay -->
  <rect x="14" y="106" width="347" height="52" rx="14" fill="none" stroke="#f87171" stroke-width="1" opacity="0.4"/>
  <text x="187" y="127" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#fca5a5" text-anchor="middle">EMERGENCY ACTION</text>
  <text x="187" y="147" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="white" text-anchor="middle">⚡ Emergency Freeze</text>


  <!-- ░░ METRIC CARDS GRID ░░ -->

  <!-- Row 1 -->
  <!-- Card 1: Active Proposals -->
  <rect x="14" y="170" width="164" height="84" rx="12" fill="url(#cardIndigo)" stroke="#4f46e5" stroke-width="1"/>
  <rect x="14" y="170" width="164" height="3" rx="1.5" fill="url(#proposeBtn)" opacity="0.9"/>
  <text x="28" y="194" font-family="sans-serif" font-size="20">📋</text>
  <text x="60" y="194" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#818cf8" filter="url(#tinyGlow)">3</text>
  <text x="28" y="212" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280">Active Proposals</text>
  <rect x="28" y="222" width="50" height="15" rx="7" fill="#052e16"/>
  <text x="53" y="233" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#86efac" text-anchor="middle">▲ +2 today</text>

  <!-- Card 2: Quarantined Assets -->
  <rect x="197" y="170" width="164" height="84" rx="12" fill="url(#cardViolet)" stroke="#7c3aed" stroke-width="1"/>
  <rect x="197" y="170" width="164" height="3" rx="1.5" fill="#7c3aed" opacity="0.9"/>
  <text x="211" y="194" font-family="sans-serif" font-size="20">🔒</text>
  <text x="243" y="194" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#a78bfa" filter="url(#tinyGlow)">14</text>
  <text x="211" y="212" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280">Quarantined Assets</text>
  <rect x="211" y="222" width="50" height="15" rx="7" fill="#2e1065"/>
  <text x="236" y="233" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#c4b5fd" text-anchor="middle">▲ +1 today</text>

  <!-- Row 2 -->
  <!-- Card 3: Volume Monitored -->
  <rect x="14" y="264" width="164" height="84" rx="12" fill="url(#cardCyan)" stroke="#0891b2" stroke-width="1"/>
  <rect x="14" y="264" width="164" height="3" rx="1.5" fill="#0891b2" opacity="0.9"/>
