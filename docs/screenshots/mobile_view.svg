  <text x="60" y="290" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" filter="url(#tinyGlow)">$1.8M</text>
  <text x="28" y="308" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280">Volume Monitored</text>
  <rect x="28" y="316" width="60" height="15" rx="7" fill="#083344"/>
  <text x="58" y="327" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#67e8f9" text-anchor="middle">▲ 24h window</text>

  <!-- Card 4: Quorum Latency -->
  <rect x="197" y="264" width="164" height="84" rx="12" fill="url(#cardGreen)" stroke="#16a34a" stroke-width="1"/>
  <rect x="197" y="264" width="164" height="3" rx="1.5" fill="#22c55e" opacity="0.9"/>
  <text x="211" y="288" font-family="sans-serif" font-size="20">⏱️</text>
  <text x="243" y="290" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#4ade80" filter="url(#tinyGlow)">3.2m</text>
  <text x="211" y="308" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280">Quorum Latency</text>
  <rect x="211" y="316" width="56" height="15" rx="7" fill="#052e16"/>
  <text x="239" y="327" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#86efac" text-anchor="middle">▼ -0.4 min</text>


  <!-- ░░ ACTIVE PROPOSALS SECTION ░░ -->
  <text x="14" y="375" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Active Proposals</text>
  <rect x="305" y="360" width="56" height="22" rx="11" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="333" y="375" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#818cf8" text-anchor="middle">View All</text>

  <!-- Proposal 1: Pending Vote -->
  <rect x="14" y="384" width="347" height="74" rx="10" fill="url(#proposalRow)" stroke="#1e2d4a" stroke-width="1"/>
  <rect x="14" y="384" width="3" height="74" rx="1.5" fill="#4f46e5"/>
  <text x="28" y="404" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe">Proposal #42</text>
  <rect x="280" y="388" width="72" height="18" rx="9" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="316" y="401" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#818cf8" text-anchor="middle">● Voting</text>
  <text x="28" y="420" font-family="JetBrains Mono, monospace" font-size="9" fill="#6b7280">GDKIJ...7ZSN — USDC</text>
  <!-- Quorum bar -->
  <rect x="28" y="432" width="200" height="6" rx="3" fill="#1f2937"/>
  <rect x="28" y="432" width="110" height="6" rx="3" fill="url(#proposeBtn)"/>
  <text x="234" y="440" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#818cf8">3 / 6 votes (50%)</text>
  <text x="28" y="450" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#6b7280">Expires in 18h 22m</text>

  <!-- Proposal 2: Quorum Reached -->
  <rect x="14" y="466" width="347" height="74" rx="10" fill="url(#proposalRow)" stroke="#1e2d4a" stroke-width="1"/>
  <rect x="14" y="466" width="3" height="74" rx="1.5" fill="#7c3aed"/>
  <text x="28" y="486" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ddd6fe">Proposal #41</text>
  <rect x="263" y="470" width="88" height="18" rx="9" fill="#2e1065" stroke="#7c3aed" stroke-width="1"/>
  <text x="307" y="483" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle">✓ Quorum Reached</text>
  <text x="28" y="502" font-family="JetBrains Mono, monospace" font-size="9" fill="#6b7280">GBVVG...9KXM — XLM</text>
  <!-- Quorum bar - full -->
  <rect x="28" y="514" width="200" height="6" rx="3" fill="#1f2937"/>
  <rect x="28" y="514" width="200" height="6" rx="3" fill="#7c3aed" opacity="0.8"/>
  <text x="234" y="522" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#a78bfa">6 / 6 votes (100%)</text>
  <text x="28" y="532" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#f59e0b">⏱ Execute in 6h 14m</text>

  <!-- Proposal 3: Pending Review -->
  <rect x="14" y="548" width="347" height="74" rx="10" fill="url(#proposalRow)" stroke="#1e2d4a" stroke-width="1"/>
  <rect x="14" y="548" width="3" height="74" rx="1.5" fill="#0891b2"/>
  <text x="28" y="568" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#cffafe">Proposal #40</text>
  <rect x="270" y="552" width="82" height="18" rx="9" fill="#083344" stroke="#0891b2" stroke-width="1"/>
  <text x="311" y="565" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#67e8f9" text-anchor="middle">⚙ Executed</text>
  <text x="28" y="584" font-family="JetBrains Mono, monospace" font-size="9" fill="#6b7280">GCFZH...2WXA — EURC</text>
  <rect x="28" y="596" width="200" height="6" rx="3" fill="#083344"/>
  <rect x="28" y="596" width="200" height="6" rx="3" fill="#0891b2" opacity="0.7"/>
  <text x="234" y="604" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#22d3ee">Freeze active</text>
  <text x="28" y="614" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#6b7280">Frozen 3 days ago · IPFS evidence attached</text>


  <!-- ░░ BOTTOM QUICK ACTION BUTTONS ░░ -->
  <rect x="14" y="634" width="164" height="42" rx="10" fill="url(#proposeBtn)" filter="url(#softGlow)"/>
  <text x="96" y="659" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">📋 New Proposal</text>

  <rect x="197" y="634" width="164" height="42" rx="10" fill="#0d1530" stroke="#374151" stroke-width="1"/>
  <text x="279" y="659" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">📜 Audit Trail</text>


  <!-- ░░ BOTTOM NAV BAR ░░ -->
  <rect x="0" y="688" width="375" height="72" fill="#030918" />
  <rect x="0" y="688" width="375" height="1" fill="#1e2d4a"/>

  <!-- Home (active) -->
  <rect x="18" y="695" width="55" height="52" rx="10" fill="#1e1b4b"/>
  <text x="45" y="716" font-family="sans-serif" font-size="20" text-anchor="middle">📊</text>
  <text x="45" y="734" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#818cf8" text-anchor="middle">Overview</text>

  <!-- Proposals -->
  <rect x="83" y="695" width="55" height="52" rx="10" fill="transparent"/>
  <text x="110" y="716" font-family="sans-serif" font-size="20" text-anchor="middle">📋</text>
  <text x="110" y="734" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">Proposals</text>

  <!-- Quarantine -->
  <rect x="150" y="695" width="75" height="52" rx="10" fill="transparent"/>
  <text x="187" y="716" font-family="sans-serif" font-size="20" text-anchor="middle">🔒</text>
  <text x="187" y="734" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">Quarantine</text>

  <!-- AML -->
  <rect x="237" y="695" width="55" height="52" rx="10" fill="transparent"/>
  <text x="264" y="716" font-family="sans-serif" font-size="20" text-anchor="middle">🤖</text>
  <text x="264" y="734" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">AML Scan</text>

  <!-- Settings -->
  <rect x="304" y="695" width="55" height="52" rx="10" fill="transparent"/>
  <text x="331" y="716" font-family="sans-serif" font-size="20" text-anchor="middle">⚙️</text>
  <text x="331" y="734" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">Settings</text>

  <!-- Home indicator bar -->
  <rect x="155" y="756" width="65" height="4" rx="2" fill="#e2e8f0" opacity="0.5"/>

</svg>
